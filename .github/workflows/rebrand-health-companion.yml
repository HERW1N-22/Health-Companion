name: One-time Health Companion branding and static hardening
on:
  push:
    branches: [main]
    paths: [.github/workflows/rebrand-health-companion.yml]
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Edit tracked source without executing application code
        shell: python
        run: |
          import pathlib, subprocess, json, re
          root = pathlib.Path('.')
          workflow = '.github/workflows/rebrand-health-companion.yml'
          paths = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          def rename(s):
              for a,b in [
                  ('https://github.com/ohwisey/vitality-oss.git','https://github.com/HERW1N-22/Health-Companion.git'),
                  ('https://github.com/ohwisey/vitality-oss','https://github.com/HERW1N-22/Health-Companion'),
                  ('https://ohwisey.github.io/vitality-oss/','http://localhost:3000/'),
                  ('getvitality.com','example.test'), ('vitality.app','example.test'),
                  ('VITALITY','HEALTH_COMPANION'),('Vitality','HealthCompanion'),('vitality','healthcompanion')]:
                  s=s.replace(a,b)
              return s
          records=[]
          for name in paths:
              if not name or name == workflow or name == 'LICENSE': continue
              path=root/name
              if name in ('mcp-handoff.zip','mcp-bundle.sh'):
                  path.unlink()
                  continue
              raw=path.read_bytes()
              dest=rename(name)
              if path.suffix.lower() not in ('.png','.jpg','.gif','.ico','.woff','.zip'):
                  text=rename(raw.decode('utf-8'))
                  if name.endswith(('.md','.example')):
                      text=text.replace('HealthCompanion','Health Companion')
                  else:
                      text=re.sub(r"""(['"])HealthCompanion\1""",r'\1Health Companion\1',text)
                      text=text.replace('>HealthCompanion<','>Health Companion<')
                      text=re.sub(r"""(title:\s*['"][^'"]*)HealthCompanion""",r'\1Health Companion',text)
                  raw=text.encode()
              records.append((path,root/dest,raw))
          for old,dest,raw in records:
              if old!=dest: old.unlink()
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_bytes(raw)
          overrides=json.loads("{\"README.md\":\"# Health Companion\\n\\nA student college project exploring personal health tracking and AI-assisted wellness. It includes nutrition and macro logging, workouts, hydration, weight trends, sleep and recovery, and optional AI coaching.\\n\\n## Features\\n- Food logging, food-photo analysis, barcode lookup, calorie and macro tracking.\\n- Weight trends, nutrition goals and adaptive calorie targets.\\n- Workout logs, hydration tracking, sleep and wearable integrations.\\n- Account authentication and per-user PostgreSQL storage through Supabase.\\n- Optional contextual AI coach.\\n\\nThe code also includes additional dashboard modules and an optional MCP integration. Integrations require their own configuration; no live API keys or populated database are included.\\n\\n## Technology\\nNext.js 14, React 18, TypeScript, vanilla CSS, Supabase, pnpm.\\n\\n## Local setup\\nUse Node.js 20+ and the pinned pnpm version in package.json.\\n\\n```bash\\ngit clone https://github.com/HERW1N-22/Health-Companion.git\\ncd Health-Companion\\ncorepack enable\\npnpm install --frozen-lockfile\\ncp .env.example .env.local\\n```\\n\\nCreate a dedicated Supabase development project, then configure these values in .env.local:\\n- NEXT_PUBLIC_SUPABASE_URL\\n- NEXT_PUBLIC_SUPABASE_ANON_KEY\\n- SUPABASE_SERVICE_ROLE_KEY (server-only)\\n- NEXT_PUBLIC_APP_URL=http://localhost:3000\\n\\nApply the database migrations using the Supabase CLI from this directory:\\n```bash\\nsupabase login\\nsupabase link --project-ref YOUR_PROJECT_REF\\nsupabase db push\\npnpm dev\\n```\\n\\nOpen http://localhost:3000. Never paste API secrets into source files, commits or chat.\\n\\n## Optional integrations\\n| Variable | Enables |\\n| --- | --- |\\n| ANTHROPIC_API_KEY | AI chat and food-photo analysis |\\n| USDA_API_KEY | Nutrition database search |\\n| CONNECTOR_ENCRYPTION_KEY | Encryption of stored connector credentials; generate a strong random key before using connectors |\\n| CRON_SECRET | Authenticated scheduled tasks |\\n| Wearable OAuth credentials | Provider-specific wearable sync |\\n\\nBarcode lookups use Open Food Facts without an API key. Verify the CLAUDE_MODEL value against the models available to your account. Other variables are explained in .env.example.\\n\\n## Validation and current limitations\\n```bash\\npnpm test -- --runInBand\\npnpm lint\\npnpm build\\n```\\n\\nRuntime setup, dependency vulnerability scanning and full user-journey testing remain pending. Review SECURITY-REVIEW.md before using real health information. The existing signup flow needs email-confirmation testing. This is an educational wellness application, not a medical diagnosis service.\\n\\n## License\\nMIT. Required third-party copyright and permission notices are retained in LICENSE.\\n\",\"HEALTH-COMPANION.md\":\"# Health Companion development\\n\\nSee README.md for setup and SECURITY-REVIEW.md for review findings. API credentials remain unconfigured. Use a fresh development database for this initial renamed version; internal table, storage and integration namespaces have changed.\\n\",\"SETUP-PROMPT.md\":\"# Health Companion setup\\n\\nFollow README.md. Keep secrets in .env.local, which is gitignored. Do not request secret values in chat or commit them. Use a dedicated development database and apply every migration, including the profile-permission hardening migration. Configure email confirmation correctly before public use. Do not create test users with a shared default password. Do not deploy or enable paid integrations unless requested.\\n\",\"SECURITY-REVIEW.md\":\"# Security review\\n\\nScope: static review of the imported source snapshot, followed by branding changes and targeted hardening. This is not a security certification.\\n\\n## Coverage\\n- Enumerated 1,557 tracked files; retrieved and pattern-scanned all 1,428 readable text files, including source, configuration, lockfiles, SQL migrations and scripts.\\n- Reviewed selected authentication, billing, credential encryption, administrative access, development scripts and external-request code.\\n- No matches for the scanned private-key, GitHub-token and long Anthropic/OpenAI-style credential patterns. This is not proof that no secret exists.\\n- Binary images, fonts and icons were inventoried but not malware-scanned or visually rebranded. The obsolete mcp-handoff.zip archive and mcp-bundle.sh source-reconstruction script were removed.\\n- Dependencies were not installed or executed. No live package-advisory audit, build, browser test, penetration test or database integration test was possible in this session.\\n\\n## Issues addressed in source\\n1. High: authenticated users had table-wide UPDATE on their own profiles row, including tier and billing columns. Added a migration restricting direct updates to onboarded. The checkout route now writes the server-owned customer ID through the server admin client, scoped to the user identity verified by getUser(). Apply the new migration before considering this fixed in a database.\\n2. Development scripts contained a shared fixed password and printed credentials. Both creation and reset scripts now require explicit opt-in and private environment credentials with a minimum password length. They refuse NODE_ENV=production. Never point them at a real-user database.\\n3. Removed obsolete bundled source artifacts to avoid maintaining an unreviewed duplicate of the code.\\n\\n## Remaining risks and validation\\n- Connector encryption falls back to a plaintext envelope when CONNECTOR_ENCRYPTION_KEY is missing. A placeholder is now documented. Configure a strong key before connecting accounts; legacy stored values need migration/reconnection.\\n- Signup email-confirmation behavior needs correction/testing before public deployment. Do not disable email verification for a public app just to bypass setup.\\n- Development seed route accepts a secret in the query string; leave SEED_KEY unset outside isolated development.\\n- HTML/SVG rendering and the custom tile bridge need dedicated adversarial testing. Pattern matches alone do not prove an exploitable XSS issue or prove safety.\\n- RLS policies, OAuth flows, service-role boundaries, upload limits, AI rate limits and billing transitions require runtime tests.\\n- Run a fresh dependency advisory audit before release. Lockfiles alone do not establish that dependencies are safe.\\n- Branding changes include internal storage keys, environment names, module/file names and SQL names. This initial version assumes a fresh database and no existing user data; do not apply it over a populated installation without a migration plan.\\n- Raster images may still contain old embedded branding. No claim is made that binary content contains no old text.\\n\\n## Follow-up\\nConfigure a dedicated Supabase development project and API keys privately. Apply all migrations, run pnpm test -- --runInBand, pnpm lint, pnpm build and pnpm audit, then test signup, logging, account isolation and billing using disposable accounts.\\n\",\"supabase/migrations/20261110000001_profiles_column_permissions.sql\":\"-- Ownership RLS does not prevent self-upgrades of tier or billing fields.\\n-- Only onboarding may be updated directly by an authenticated client.\\n-- Billing writes continue through the existing server-only service role.\\nbegin;\\nrevoke update on table public.profiles from public, anon, authenticated;\\nrevoke update (id, onboarded, tier, created_at, stripe_customer_id, subscription_status, current_period_end)\\n  on public.profiles from public, anon, authenticated;\\ngrant update (onboarded) on public.profiles to authenticated;\\ncommit;\\n\",\"scripts/create-test-user.mjs\":\"#!/usr/bin/env node\\n/**\\n * One-off: create a fully-onboarded test user against the live Supabase\\n * project so we can drive end-to-end checkout flows without going\\n * through signup + onboarding + email confirmation.\\n *\\n * Reads SUPABASE_SERVICE_ROLE_KEY from .env.local. Service role bypasses\\n * RLS — required to flip onboarded=true on profiles + insert\\n * user_profile.\\n *\\n * Idempotent: re-runs are no-ops (delete the user first if you want a\\n * clean slate).\\n *\\n * Run from repo root:\\n *   node scripts/create-test-user.mjs\\n */\\n\\nimport { readFile } from 'node:fs/promises'\\nimport { dirname, join } from 'node:path'\\nimport { fileURLToPath } from 'node:url'\\nimport { createClient } from '@supabase/supabase-js'\\n\\nconst ROOT = join(dirname(fileURLToPath(import.meta.url)), '..')\\n\\nasync function loadEnv() {\\n  const text = await readFile(join(ROOT, '.env.local'), 'utf8')\\n  const out = {}\\n  for (const raw of text.split('\\\\n')) {\\n    const line = raw.trim()\\n    if (!line || line.startsWith('#')) continue\\n    const eq = line.indexOf('=')\\n    if (eq === -1) continue\\n    out[line.slice(0, eq).trim()] = line.slice(eq + 1).trim()\\n  }\\n  return out\\n}\\n\\nconst TEST_EMAIL = process.env.HEALTH_COMPANION_TEST_EMAIL\\nconst TEST_PASSWORD = process.env.HEALTH_COMPANION_TEST_PASSWORD\\n\\nasync function main() {\\n  if (process.env.NODE_ENV === 'production' || process.env.ALLOW_TEST_USER_CREATION !== 'true') {\\n    throw new Error('Test-user creation is disabled. Opt in only against a development database.')\\n  }\\n  if (!TEST_EMAIL || !TEST_PASSWORD || TEST_PASSWORD.length < 16) {\\n    throw new Error('Set HEALTH_COMPANION_TEST_EMAIL and a unique HEALTH_COMPANION_TEST_PASSWORD of at least 16 characters in your local environment.')\\n  }\\n  const env = await loadEnv()\\n  const url = env.NEXT_PUBLIC_SUPABASE_URL\\n  const serviceKey = env.SUPABASE_SERVICE_ROLE_KEY\\n  if (!url || !serviceKey) {\\n    console.error('Missing NEXT_PUBLIC_SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY')\\n    process.exit(1)\\n  }\\n\\n  const supabase = createClient(url, serviceKey, {\\n    auth: { persistSession: false, autoRefreshToken: false },\\n  })\\n\\n  // Look up first — admin.listUsers + filter by email. (createUser\\n  // would 422 if the email already exists, which we want to handle\\n  // as \\\"already done, just print the creds\\\".)\\n  console.log(`Checking for existing user ${TEST_EMAIL}…`)\\n  const { data: listed } = await supabase.auth.admin.listUsers({ perPage: 200 })\\n  const existing = listed?.users?.find((u) => u.email === TEST_EMAIL)\\n\\n  let userId\\n  if (existing) {\\n    userId = existing.id\\n    console.log(`Found existing user ${userId} — resetting password just in case.`)\\n    await supabase.auth.admin.updateUserById(userId, {\\n      password: TEST_PASSWORD,\\n      email_confirm: true,\\n    })\\n  } else {\\n    console.log('Creating fresh auth user…')\\n    const { data: created, error } = await supabase.auth.admin.createUser({\\n      email: TEST_EMAIL,\\n      password: TEST_PASSWORD,\\n      email_confirm: true, // skip the email verification step\\n    })\\n    if (error) {\\n      console.error('createUser failed:', error.message)\\n      process.exit(1)\\n    }\\n    userId = created.user.id\\n    console.log(`Created auth user ${userId}`)\\n  }\\n\\n  // Profile — flip onboarded=true so middleware lets us through to /app.\\n  // tier='free' (default) so we start in the upgrade-to-pro state.\\n  console.log('Upserting profiles row…')\\n  const { error: profileError } = await supabase\\n    .from('profiles')\\n    .upsert(\\n      {\\n        id: userId,\\n        onboarded: true,\\n        tier: 'free',\\n      },\\n      { onConflict: 'id' }\\n    )\\n  if (profileError) {\\n    console.error('profiles upsert failed:', profileError.message)\\n    process.exit(1)\\n  }\\n\\n  // user_profile — has NOT NULL columns from BUILD02. Plausible defaults\\n  // so any downstream module that reads from this row doesn't crash.\\n  console.log('Upserting user_profile row…')\\n  const { error: upError } = await supabase\\n    .from('user_profile')\\n    .upsert(\\n      {\\n        user_id: userId,\\n        first_name: 'Tester',\\n        birthday: '1995-01-01',\\n        sex: 'M',\\n        height_cm: 180,\\n        starting_weight_kg: 75,\\n        units: 'metric',\\n        goal: 'maintain',\\n        onboarding_step: 5,\\n      },\\n      { onConflict: 'user_id' }\\n    )\\n  if (upError) {\\n    console.error('user_profile upsert failed:', upError.message)\\n    process.exit(1)\\n  }\\n\\n  console.log('')\\n  console.log('───────────────────────────────────────────────')\\n  console.log('  Test user ready. Sign in at /login with:')\\n  console.log('')\\n  console.log(`    Email:    ${TEST_EMAIL}`)\\n  console.log('    Password: supplied privately through the local environment')\\n  console.log('')\\n  console.log(`  User id: ${userId}`)\\n  console.log('───────────────────────────────────────────────')\\n}\\n\\nmain().catch((err) => {\\n  console.error('create-test-user failed:', err.message)\\n  process.exit(1)\\n})\\n\",\"scripts/reset-test-user.mjs\":\"#!/usr/bin/env node\\n/**\\n * Wipe-and-recreate the Stripe test user.\\n *\\n * Anytime testing leaves the system in a confusing state — Stripe customer\\n * lingering, subscription stuck, profiles row mismatched, etc. — run this\\n * script and you're back to a clean known baseline:\\n *\\n *   Credentials must be provided privately through the local environment.\\n *   tier=free, onboarded=true, no Stripe customer, no subscriptions\\n *\\n * Steps:\\n *   1. Look up existing test user by email in Supabase.\\n *   2. If found, read profiles.stripe_customer_id. If present, delete the\\n *      Stripe customer (which cancels all of its subscriptions).\\n *   3. Delete user_profile + profiles rows for the user (belt-and-suspenders\\n *      in case the auth.users FK isn't cascaded).\\n *   4. Delete the Supabase auth user.\\n *   5. Recreate fresh with onboarded=true + tier=free.\\n *\\n * Safe to run any time. In sandbox mode the Stripe deletion is fully\\n * destructive but consequence-free. NEVER add a `--live` flag to this\\n * script without a 10-second \\\"are you sure\\\" confirmation — deleting a\\n * real customer in live mode wipes their payment history.\\n *\\n * Run from repo root:\\n *   node scripts/reset-test-user.mjs\\n */\\n\\nimport { readFile } from 'node:fs/promises'\\nimport { dirname, join } from 'node:path'\\nimport { fileURLToPath } from 'node:url'\\nimport Stripe from 'stripe'\\nimport { createClient } from '@supabase/supabase-js'\\n\\nconst ROOT = join(dirname(fileURLToPath(import.meta.url)), '..')\\n\\nconst TEST_EMAIL = process.env.HEALTH_COMPANION_TEST_EMAIL\\nconst TEST_PASSWORD = process.env.HEALTH_COMPANION_TEST_PASSWORD\\n\\nasync function loadEnv() {\\n  const text = await readFile(join(ROOT, '.env.local'), 'utf8')\\n  const out = {}\\n  for (const raw of text.split('\\\\n')) {\\n    const line = raw.trim()\\n    if (!line || line.startsWith('#')) continue\\n    const eq = line.indexOf('=')\\n    if (eq === -1) continue\\n    out[line.slice(0, eq).trim()] = line.slice(eq + 1).trim()\\n  }\\n  return out\\n}\\n\\nasync function main() {\\n  if (process.env.NODE_ENV === 'production' || process.env.ALLOW_TEST_USER_RESET !== 'true') throw new Error('Test-user reset is disabled; opt in only for a disposable development account.')\\n  if (!TEST_EMAIL || !TEST_PASSWORD || TEST_PASSWORD.length < 16) throw new Error('Provide a unique test email and password of at least 16 characters through the local environment.')\\n  const env = await loadEnv()\\n  const url = env.NEXT_PUBLIC_SUPABASE_URL\\n  const serviceKey = env.SUPABASE_SERVICE_ROLE_KEY\\n  const stripeKey = env.STRIPE_SECRET_KEY\\n  if (!url || !serviceKey || !stripeKey) {\\n    console.error('Missing env vars (NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, STRIPE_SECRET_KEY)')\\n    process.exit(1)\\n  }\\n  // Guard against ever doing this on a live Stripe account by accident.\\n  if (stripeKey.startsWith('sk_live_')) {\\n    console.error('REFUSING to run against a LIVE Stripe key. This script deletes customers.')\\n    process.exit(1)\\n  }\\n\\n  const supabase = createClient(url, serviceKey, {\\n    auth: { persistSession: false, autoRefreshToken: false },\\n  })\\n  const stripe = new Stripe(stripeKey, { apiVersion: '2026-04-22.dahlia' })\\n\\n  // 1. Find existing test user\\n  console.log(`Looking up ${TEST_EMAIL}…`)\\n  const { data: listed } = await supabase.auth.admin.listUsers({ perPage: 200 })\\n  const existing = listed?.users?.find((u) => u.email === TEST_EMAIL)\\n\\n  if (existing) {\\n    const userId = existing.id\\n    console.log(`Found ${userId}, wiping…`)\\n\\n    // 2. Read stripe_customer_id from profiles\\n    const { data: profile } = await supabase\\n      .from('profiles')\\n      .select('stripe_customer_id')\\n      .eq('id', userId)\\n      .maybeSingle()\\n\\n    // 2b. Delete Stripe customer (cancels all its subs automatically)\\n    if (profile?.stripe_customer_id) {\\n      console.log(`  Deleting Stripe customer ${profile.stripe_customer_id}…`)\\n      try {\\n        await stripe.customers.del(profile.stripe_customer_id)\\n      } catch (err) {\\n        // 404 means the customer was already deleted in a prior run — fine\\n        if (err.statusCode === 404) {\\n          console.log('  (customer already gone in Stripe — continuing)')\\n        } else {\\n          throw err\\n        }\\n      }\\n    }\\n\\n    // 3. Delete user_profile + profiles rows\\n    console.log('  Deleting user_profile row…')\\n    await supabase.from('user_profile').delete().eq('user_id', userId)\\n    console.log('  Deleting profiles row…')\\n    await supabase.from('profiles').delete().eq('id', userId)\\n\\n    // 4. Delete auth user\\n    console.log('  Deleting auth user…')\\n    const { error: deleteError } = await supabase.auth.admin.deleteUser(userId)\\n    if (deleteError) {\\n      console.error('  auth.deleteUser failed:', deleteError.message)\\n      process.exit(1)\\n    }\\n  } else {\\n    console.log('No existing user — fresh create.')\\n  }\\n\\n  // 5. Recreate fresh\\n  console.log('')\\n  console.log('Creating fresh test user…')\\n  const { data: created, error: createError } = await supabase.auth.admin.createUser({\\n    email: TEST_EMAIL,\\n    password: TEST_PASSWORD,\\n    email_confirm: true,\\n  })\\n  if (createError) {\\n    console.error('createUser failed:', createError.message)\\n    process.exit(1)\\n  }\\n  const newUserId = created.user.id\\n\\n  // Supabase has an on-insert trigger that auto-creates a profiles row.\\n  // Upsert overwrites the auto-created default values (e.g. tier='free' is\\n  // probably already there, but onboarded=false would be the default).\\n  const { error: profileError } = await supabase\\n    .from('profiles')\\n    .upsert({ id: newUserId, onboarded: true, tier: 'free' }, { onConflict: 'id' })\\n  if (profileError) {\\n    console.error('profiles upsert failed:', profileError.message)\\n    process.exit(1)\\n  }\\n\\n  const { error: upError } = await supabase\\n    .from('user_profile')\\n    .upsert(\\n      {\\n        user_id: newUserId,\\n        first_name: 'Tester',\\n        birthday: '1995-01-01',\\n        sex: 'M',\\n        height_cm: 180,\\n        starting_weight_kg: 75,\\n        units: 'metric',\\n        goal: 'maintain',\\n        onboarding_step: 5,\\n      },\\n      { onConflict: 'user_id' }\\n    )\\n  if (upError) {\\n    console.error('user_profile upsert failed:', upError.message)\\n    process.exit(1)\\n  }\\n\\n  console.log('')\\n  console.log('───────────────────────────────────────────────')\\n  console.log('  Reset complete. Clean test user:')\\n  console.log('')\\n  console.log(`    Email:    ${TEST_EMAIL}`)\\n  console.log('    Password: supplied privately through the local environment')\\n  console.log(`    Tier:     free`)\\n  console.log(`    User id:  ${newUserId}`)\\n  console.log('───────────────────────────────────────────────')\\n}\\n\\nmain().catch((err) => {\\n  console.error('reset-test-user failed:', err.message)\\n  if (err.raw) console.error(err.raw)\\n  process.exit(1)\\n})\\n\",\"app/api/stripe/checkout/route.ts\":\"import { NextResponse } from 'next/server'\\n\\nimport { createClient } from '@/lib/supabase/server'\\nimport { createAdminClient } from '@/lib/supabase/admin'\\nimport { getPriceId, getStripe } from '@/lib/stripe/client'\\n\\n// POST /api/stripe/checkout\\n//\\n// Authed users only. Get-or-creates the Stripe Customer for this\\n// Supabase user, persists customer_id on the profile, opens a\\n// Stripe Checkout Session for the Pro price, and returns the\\n// hosted-checkout URL. The client redirects window.location to it.\\n//\\n// Already-pro users are short-circuited with 409 so we don't open a\\n// second subscription on the same customer.\\nexport async function POST() {\\n  const supabase = createClient()\\n  const {\\n    data: { user },\\n  } = await supabase.auth.getUser()\\n  if (!user) {\\n    return NextResponse.json({ error: 'unauthorized' }, { status: 401 })\\n  }\\n\\n  const { data: profile, error: profileError } = await supabase\\n    .from('profiles')\\n    .select('stripe_customer_id, tier')\\n    .eq('id', user.id)\\n    .single()\\n\\n  if (profileError || !profile) {\\n    return NextResponse.json({ error: 'profile_not_found' }, { status: 404 })\\n  }\\n\\n  if (profile.tier === 'pro') {\\n    return NextResponse.json({ error: 'already_pro' }, { status: 409 })\\n  }\\n\\n  const stripe = getStripe()\\n  const priceId = getPriceId()\\n\\n  // Get-or-create the Stripe Customer. The single source of truth for\\n  // the user→customer link is `profiles.stripe_customer_id`. If a\\n  // future checkout races with a webhook, the unique index on the\\n  // column keeps us from double-creating.\\n  let customerId = profile.stripe_customer_id\\n  if (!customerId) {\\n    const customer = await stripe.customers.create({\\n      email: user.email ?? undefined,\\n      metadata: { supabase_user_id: user.id },\\n    })\\n    customerId = customer.id\\n\\n    // Server-owned billing field; identity was verified by getUser() above.\\n    const { error: saveError } = await createAdminClient()\\n      .from('profiles')\\n      .update({ stripe_customer_id: customerId })\\n      .eq('id', user.id)\\n    // Soft-fail — the webhook re-reads customer.metadata.supabase_user_id\\n    // and patches the row if this write didn't land. We log so the\\n    // failure shows up in Vercel logs.\\n    if (saveError) {\\n      console.error('[checkout] save stripe_customer_id failed', saveError)\\n    }\\n  }\\n\\n  const baseUrl =\\n    process.env.NEXT_PUBLIC_APP_URL ?? 'http://localhost:3000'\\n\\n  const session = await stripe.checkout.sessions.create({\\n    customer: customerId,\\n    mode: 'subscription',\\n    line_items: [{ price: priceId, quantity: 1 }],\\n    // Land on /welcome-to-pro — the high-emotion celebration screen\\n    // (confetti + warm welcome + feature ladder). Webhook may or may\\n    // not have processed by the time we redirect, but the page doesn't\\n    // depend on tier flipping yet — it trusts the redirect itself as\\n    // proof of purchase. See app/welcome-to-pro/page.tsx.\\n    success_url: `${baseUrl}/welcome-to-pro`,\\n    cancel_url: `${baseUrl}/pricing?checkout=cancelled`,\\n    // Stripe sends the same metadata back on the Subscription, which\\n    // is what we read in the webhook to look up the Supabase user.\\n    metadata: { supabase_user_id: user.id },\\n    subscription_data: {\\n      metadata: { supabase_user_id: user.id },\\n    },\\n    allow_promotion_codes: false,\\n  })\\n\\n  if (!session.url) {\\n    return NextResponse.json({ error: 'no_session_url' }, { status: 500 })\\n  }\\n\\n  return NextResponse.json({ url: session.url })\\n}\\n\",\".env.example\":\"# Health Companion environment variables.\\n# Copy this file to `.env.local` (gitignored) and fill in real values.\\n# Only the Supabase block is required — everything else is optional and the\\n# app degrades gracefully (features tell the user they aren't configured).\\n\\n# --- Supabase (REQUIRED) ---\\n# Create a free project at https://supabase.com, then:\\n#   Project Settings → API → Project URL / anon key / service_role key\\n# Apply the schema with the Supabase CLI: `supabase link` + `supabase db push`\\n# (migrations live in supabase/migrations/).\\nNEXT_PUBLIC_SUPABASE_URL=\\nNEXT_PUBLIC_SUPABASE_ANON_KEY=\\n# service_role: NEVER commit, NEVER expose to the client. Server-only.\\nSUPABASE_SERVICE_ROLE_KEY=\\n\\n# --- App base URL ---\\n# Absolute origin of this deployment; used to build OAuth redirect URLs.\\n# Dev: http://localhost:3000 · Prod: https://<your-domain>\\nNEXT_PUBLIC_APP_URL=http://localhost:3000\\n# Public site URL for robots.txt/sitemap.xml (falls back to localhost).\\nNEXT_PUBLIC_SITE_URL=\\n\\n# --- Anthropic / Claude (AI mentor, brand intake, food-photo analysis, Forge) ---\\n# Server-only. https://console.anthropic.com → API Keys.\\nANTHROPIC_API_KEY=\\n# Optional model override.\\nCLAUDE_MODEL=claude-sonnet-5\\n\\n# --- Stripe (optional paid tiers) ---\\n# Test keys from https://dashboard.stripe.com/test/apikeys.\\n# Run `node scripts/stripe-bootstrap.mjs` to create the product + price.\\nSTRIPE_SECRET_KEY=\\nSTRIPE_WEBHOOK_SECRET=\\nSTRIPE_PRICE_ID=\\n# Reserved — checkout is fully server-side, so nothing reads this today.\\nNEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=\\n\\n# --- WHOOP (wearable recovery/sleep/strain) — BRING-YOUR-OWN-CREDENTIALS ---\\n# Each user pastes their own WHOOP app's client_id/secret in-app (stored\\n# per-user), so no global WHOOP keys are needed. Only the redirect URI is\\n# global — it gates whether WHOOP appears in the vitals gallery.\\n#   dev  → http://localhost:3000/api/whoop/callback\\n#   prod → https://<your-domain>/api/whoop/callback\\nWHOOP_REDIRECT_URI=http://localhost:3000/api/whoop/callback\\n# Legacy shared-app credentials (unused in BYO mode, safe to leave blank).\\nWHOOP_CLIENT_ID=\\nWHOOP_CLIENT_SECRET=\\n\\n# --- Fitbit (wearable steps/sleep) — one shared OAuth app for all users ---\\n# Register at https://dev.fitbit.com (OAuth 2.0 Application Type: Server).\\n# The registered Redirect URI must match FITBIT_REDIRECT_URI exactly.\\nFITBIT_CLIENT_ID=\\nFITBIT_CLIENT_SECRET=\\nFITBIT_REDIRECT_URI=http://localhost:3000/api/fitbit/callback\\n\\n# --- Oura (wearable recovery/sleep) — one shared OAuth app for all users ---\\n# Register at https://cloud.ouraring.com/oauth/applications.\\n# Also gates whether Oura appears in the vitals gallery.\\nOURA_CLIENT_ID=\\nOURA_CLIENT_SECRET=\\nOURA_REDIRECT_URI=http://localhost:3000/api/oura/callback\\n\\n# --- Nutrition (Fuel module) ---\\n# Free key, instant: https://fdc.nal.usda.gov/api-key-signup.html\\n# Open Food Facts barcode lookups need no key.\\nUSDA_API_KEY=\\n\\n# --- Finance module ---\\n# Free tier: https://finnhub.io/register (60 calls/min). Server-only.\\nFINNHUB_API_KEY=\\n# Optional; CoinGecko's keyless endpoints are used when unset.\\nCOINGECKO_API_KEY=\\n\\n# --- YouTube Data API v3 (Brand module: channel refresh + recent videos) ---\\n# https://console.cloud.google.com → enable \\\"YouTube Data API v3\\\" → API key.\\nYOUTUBE_API_KEY=\\n\\n# --- Google / Gmail OAuth (email-based wearable import, optional) ---\\nGOOGLE_CLIENT_ID=\\nGOOGLE_CLIENT_SECRET=\\n# Optional inbound-email ingest domain for the Cloudflare worker in workers/.\\nNEXT_PUBLIC_EMAIL_INGEST_DOMAIN=\\n\\n# --- Other connectors (all optional) ---\\nYOUTUBE_OAUTH_CLIENT_ID=\\nYOUTUBE_OAUTH_CLIENT_SECRET=\\nTWITCH_CLIENT_ID=\\nTWITCH_CLIENT_SECRET=\\nPATREON_CLIENT_ID=\\nPATREON_CLIENT_SECRET=\\nPATREON_WEBHOOK_SECRET=\\n\\n# --- Hosted MCP (connect Claude to the dashboard; optional) ---\\n# The MCP endpoint lives at <NEXT_PUBLIC_APP_URL>/api/mcp/mcp.\\n# Dark-launch flag: route + OAuth endpoints 404 unless exactly \\\"true\\\".\\nMCP_ENABLED=false\\n# Supabase project's LEGACY HS256 JWT secret (Settings → API → JWT Keys →\\n# Legacy JWT Secret). Used only to mint short-lived RLS JWTs.\\nSUPABASE_JWT_SECRET=\\n# Dedicated HS256 secret for signing MCP OAuth access tokens. Any long\\n# random string — keep it separate from SUPABASE_JWT_SECRET.\\nMCP_OAUTH_SIGNING_SECRET=\\nMCP_CHECK_PROOF_SECRET=\\n\\n# --- Cron + admin ---\\n# Shared secret protecting /api/cron/* routes (set the same value in your\\n# scheduler, e.g. Vercel Cron).\\nCRON_SECRET=\\n# Comma-separated emails whose accounts see dogfood/curation surfaces.\\nFOUNDER_EMAILS=\\n# Protects the dev seed route (/api/dev/seed-whoop).\\nSEED_KEY=\\n\\n# --- Sentry (optional error monitoring) ---\\nSENTRY_DSN=\\nNEXT_PUBLIC_SENTRY_DSN=\\nSENTRY_ORG=\\nSENTRY_PROJECT=\\n\\n# --- Misc ---\\n# IANA timezone used by server-side day boundaries (defaults to UTC).\\nHEALTH_COMPANION_TIMEZONE=\\n# Optional Amazon affiliate tag for supplement links.\\nNEXT_PUBLIC_AMAZON_AFFILIATE_TAG=\\n# Optional self-hosted Plausible analytics host.\\nPLAUSIBLE_HOST=\\n\\n# --- Optional: project a daily summary into a second Supabase store ---\\n# Lets a household/team mirror one user's wearable summary into a shared\\n# dashboard. All four must be set together or the nightly cron skips it.\\nSHARED_BRAIN_SUPABASE_URL=\\nSHARED_BRAIN_SUPABASE_ANON_KEY=\\nSHARED_BRAIN_OWNER_KEY=\\nWHOOP_SHARED_PROVIDER_USER_ID=\\n\\n# --- Test-user reset script (scripts/reset-test-user.mjs, dev only) ---\\nHEALTH_COMPANION_USER_EMAIL=\\nHEALTH_COMPANION_USER_PASSWORD=\\nHEALTH_COMPANION_USER_ID=\\nHEALTH_COMPANION_SUPABASE_SERVICE_ROLE_KEY=\\n\\n# Encryption for stored connector credentials. Keep a strong random key private.\\n# Generate locally with: openssl rand -hex 32\\nCONNECTOR_ENCRYPTION_KEY=\\n\"}")
          for name,text in overrides.items():
              p=root/name
              p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(text)
          (root/workflow).unlink()
          # Validate text and filenames without importing or running project code.
          for p in root.rglob('*'):
              if '.git' in p.parts or not p.is_file() or str(p)=='LICENSE': continue
              assert 'vitality' not in str(p).lower(), str(p)
              if p.suffix.lower() in ('.png','.jpg','.gif','.ico','.woff','.zip'): continue
              text=p.read_text()
              assert 'vitality' not in text.lower(), str(p)
              if p.suffix == '.json' and str(p) not in ('tsconfig.json','mcp/tsconfig.json'):
                  json.loads(text)
          print('Brand text and JSON validation passed.')
          
      - name: Commit and remove this one-time workflow
        run: |
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -m "refactor: brand Health Companion and harden profile permissions"
          git push origin HEAD:main
